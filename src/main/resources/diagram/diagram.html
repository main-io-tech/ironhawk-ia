<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root { /*IRON_DOME_THEME_CSS*/ }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 12px "Segoe UI", "Inter", -apple-system, sans-serif; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; user-select: none; }
  svg.panning { cursor: grabbing; }
  .panel { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .15); }
  #toolbar { top: 10px; left: 10px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; }
  #toolbar input { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg);
    font: inherit; padding: 4px 8px; width: 190px; outline: 0; }
  #toolbar input:focus { border-color: var(--accent); }
  #matches { color: var(--muted); font-size: 11px; min-width: 40px; }
  #zoom { right: 10px; bottom: 10px; padding: 4px; display: flex; flex-direction: column; gap: 4px; }
  button { background: transparent; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; width: 28px; height: 28px;
    font: 15px/1 inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #info { left: 10px; bottom: 10px; padding: 4px 10px; color: var(--muted); font-size: 11px; }
  #info b { color: var(--fg); font-weight: 600; }
  #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); }

  .box rect.frame { fill: var(--box); stroke: var(--edge); stroke-width: 1; }
  .box.focus rect.frame { stroke: var(--accent); stroke-width: 2.5; }
  .box.selected rect.frame { stroke: var(--accent); stroke-width: 2; }
  .box.dim { opacity: .25; }
  .box.match rect.frame { stroke: var(--match); stroke-width: 2.5; }
  .box { cursor: pointer; }
  .box text { fill: var(--fg); font-size: 12px; }
  .box text.stereo { fill: var(--muted); font-size: 10.5px; }
  .box text.name { font-weight: 600; font-size: 13px; }
  .box text.abstract { font-style: italic; }
  .box text.pkg { fill: var(--muted); font-size: 10px; }
  .box text.member { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace; font-size: 11px; }
  .box text.more { fill: var(--muted); font-size: 11px; font-style: italic; }
  .box line.sep { stroke: var(--edge); stroke-width: 1; }
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.3; }
  .edge.dashed { stroke-dasharray: 6 4; }
  .edge.dim { opacity: .2; }
  marker .hollow { fill: var(--box); stroke: var(--edge); stroke-width: 1.3; }
  marker .open { fill: none; stroke: var(--edge); stroke-width: 1.3; }
</style>
</head>
<body>
<svg id="canvas">
  <defs>
    <marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path class="hollow" d="M1,1 L11,6 L1,11 Z"/>
    </marker>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse">
      <path class="open" d="M1,1 L11,6 L1,11"/>
    </marker>
  </defs>
  <g id="viewport"><g id="edges"></g><g id="boxes"></g></g>
</svg>
<div id="toolbar" class="panel">
  <input id="search" placeholder="Buscar classe  ( / )"><span id="matches"></span>
</div>
<div id="info" class="panel"></div>
<div id="zoom" class="panel">
  <button id="zoomIn" title="Aproximar">+</button>
  <button id="zoomOut" title="Afastar">&minus;</button>
  <button id="fit" title="Enquadrar o diagrama">&#x25A3;</button>
  <button id="centerFocus" title="Centralizar na classe analisada">&#x25CE;</button>
</div>
<div id="empty">Nenhuma classe no diagrama</div>
<script>
  const DATA = /*IRON_DOME_DATA*/;
  function ironDomeSend(message) { /*IRON_DOME_BRIDGE*/ }

  const NS = 'http://www.w3.org/2000/svg';
  const PAD = 10, LINE = 16, GAP_X = 50, GAP_Y = 90, MIN_WIDTH = 130;
  const KIND_FILL = { CLASS: 'kindClass', ABSTRACT: 'kindAbstract', INTERFACE: 'kindInterface', ENUM: 'kindEnum', ANNOTATION: 'kindAnnotation' };
  const STEREOTYPE = { INTERFACE: '«interface»', ENUM: '«enumeration»', ANNOTATION: '«annotation»' };

  const svg = document.getElementById('canvas');
  const viewport = document.getElementById('viewport');
  const edgesLayer = document.getElementById('edges');
  const boxesLayer = document.getElementById('boxes');
  const byId = new Map(DATA.nodes.map(n => [n.id, n]));
  const measure = document.createElement('canvas').getContext('2d');
  const css = name => getComputedStyle(document.documentElement).getPropertyValue('--' + name).trim();

  function el(tag, attrs = {}, parent) {
    const node = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (parent) parent.appendChild(node);
    return node;
  }
  function textWidth(text, font) { measure.font = font; return measure.measureText(text).width; }

  /* ---- Medidas das caixas: cabeçalho (estereótipo, nome, pacote), atributos e operações ---- */
  const MEMBER_FONT = '11px Consolas, "Cascadia Mono", monospace';
  DATA.nodes.forEach(n => {
    const attributes = n.attributes.slice();
    const operations = n.operations.slice();
    if (n.hiddenAttributes) attributes.push('… mais ' + n.hiddenAttributes);
    if (n.hiddenOperations) operations.push('… mais ' + n.hiddenOperations);
    n.rows = { attributes, operations };
    const widths = [textWidth(n.name, 'bold 13px "Segoe UI"'), textWidth(n.pkg || '(pacote padrão)', '10px "Segoe UI"')];
    if (STEREOTYPE[n.kind]) widths.push(textWidth(STEREOTYPE[n.kind], '10.5px "Segoe UI"'));
    [...attributes, ...operations].forEach(row => widths.push(textWidth(row, MEMBER_FONT)));
    n.w = Math.max(MIN_WIDTH, Math.ceil(Math.max(...widths)) + PAD * 2);
    n.headerH = (STEREOTYPE[n.kind] ? 14 : 0) + 20 + 14 + 6;
    n.attrH = attributes.length ? attributes.length * LINE + 8 : 10;
    n.opsH = operations.length ? operations.length * LINE + 8 : 10;
    n.h = n.headerH + n.attrH + n.opsH;
  });

  /* ---- Camadas: quem generaliza fica acima; dependências descem. Ciclos são cortados na busca em profundidade ---- */
  function layout() {
    const constraints = [];
    DATA.edges.forEach(e => {
      if (!byId.has(e.source) || !byId.has(e.target)) return;
      constraints.push(e.kind === 'EXTENDS' || e.kind === 'IMPLEMENTS'
        ? { upper: e.target, lower: e.source, weight: 0 }
        : { upper: e.source, lower: e.target, weight: 1 });
    });
    constraints.sort((a, b) => a.weight - b.weight);
    const below = new Map(DATA.nodes.map(n => [n.id, []]));
    const accepted = [];
    const reaches = (from, goal, seen = new Set()) => {
      if (from === goal) return true;
      if (seen.has(from)) return false;
      seen.add(from);
      return below.get(from).some(next => reaches(next, goal, seen));
    };
    constraints.forEach(c => {
      if (c.upper === c.lower || reaches(c.lower, c.upper)) return;
      below.get(c.upper).push(c.lower);
      accepted.push(c);
    });
    const rank = new Map(DATA.nodes.map(n => [n.id, 0]));
    for (let pass = 0; pass < DATA.nodes.length; pass++) {
      let changed = false;
      accepted.forEach(c => {
        if (rank.get(c.lower) < rank.get(c.upper) + 1) { rank.set(c.lower, rank.get(c.upper) + 1); changed = true; }
      });
      if (!changed) break;
    }
    const layers = [];
    DATA.nodes.forEach(n => { (layers[rank.get(n.id)] = layers[rank.get(n.id)] || []).push(n); });
    const rows = layers.filter(Boolean);
    const order = new Map();
    rows.forEach(row => row.forEach((n, i) => order.set(n.id, i)));
    const neighbors = id => DATA.edges.flatMap(e => e.source === id ? [e.target] : e.target === id ? [e.source] : []).filter(x => order.has(x));
    for (let sweep = 0; sweep < 4; sweep++) {
      (sweep % 2 ? rows.slice().reverse() : rows).forEach(row => {
        const score = n => { const ns = neighbors(n.id); return ns.length ? ns.reduce((sum, x) => sum + order.get(x), 0) / ns.length : order.get(n.id); };
        row.sort((a, b) => score(a) - score(b));
        row.forEach((n, i) => order.set(n.id, i));
      });
    }
    const widths = rows.map(row => row.reduce((sum, n) => sum + n.w, 0) + GAP_X * (row.length - 1));
    const total = Math.max(0, ...widths);
    let y = 0;
    rows.forEach((row, index) => {
      let x = (total - widths[index]) / 2;
      const height = Math.max(...row.map(n => n.h));
      row.forEach(n => { n.x = x; n.y = y; x += n.w + GAP_X; });
      y += height + GAP_Y;
    });
  }

  /* ---- Desenho ---- */
  const boxEls = new Map();
  function draw() {
    DATA.nodes.forEach(n => {
      const g = el('g', { class: 'box' + (n.id === DATA.focus ? ' focus' : ''), transform: `translate(${n.x},${n.y})` }, boxesLayer);
      const title = el('title', {}, g);
      title.textContent = `${n.id}\nDependem dela: ${n.afferent} · Ela depende de: ${n.efferent}`;
      el('rect', { class: 'frame', width: n.w, height: n.h, rx: 4 }, g);
      el('rect', { width: n.w, height: n.headerH, rx: 4, fill: css(KIND_FILL[n.kind] || 'kindClass'), stroke: 'none' }, g);
      el('rect', { y: n.headerH - 5, width: n.w, height: 5, fill: css(KIND_FILL[n.kind] || 'kindClass'), stroke: 'none' }, g);
      let y = 4;
      if (STEREOTYPE[n.kind]) { y += 11; centered(g, STEREOTYPE[n.kind], n.w, y, 'stereo'); y += 3; }
      y += 16; centered(g, n.name, n.w, y, 'name' + (n.kind === 'ABSTRACT' ? ' abstract' : ''));
      y += 13; centered(g, n.pkg || '(pacote padrão)', n.w, y, 'pkg');
      el('line', { class: 'sep', x1: 0, x2: n.w, y1: n.headerH, y2: n.headerH }, g);
      n.rows.attributes.forEach((row, i) => member(g, row, n.headerH + 4 + (i + 1) * LINE - 4, n.attributes.length <= i));
      const opsTop = n.headerH + n.attrH;
      el('line', { class: 'sep', x1: 0, x2: n.w, y1: opsTop, y2: opsTop }, g);
      n.rows.operations.forEach((row, i) => member(g, row, opsTop + 4 + (i + 1) * LINE - 4, n.operations.length <= i));
      g.addEventListener('click', e => {
        select(n.id);
        ironDomeSend(e.ctrlKey || e.metaKey ? 'focus:' + n.id : 'select:' + n.id);
      });
      g.addEventListener('dblclick', () => ironDomeSend('open:' + n.id));
      g.addEventListener('mousedown', e => e.stopPropagation());
      boxEls.set(n.id, g);
    });
    drawEdges();
  }
  function centered(parent, text, width, y, cls) {
    const t = el('text', { x: width / 2, y, 'text-anchor': 'middle', class: cls }, parent);
    t.textContent = text;
  }
  function member(parent, text, y, more) {
    const t = el('text', { x: PAD, y, class: more ? 'more' : 'member' }, parent);
    t.textContent = text;
  }

  /* Liga as bordas das caixas, e não os centros; o par de ligações em sentidos opostos é afastado. */
  function clip(n, toward) {
    const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
    const dx = toward.x - cx, dy = toward.y - cy;
    const scale = 1 / Math.max(Math.abs(dx) / (n.w / 2) || 0.0001, Math.abs(dy) / (n.h / 2) || 0.0001);
    return { x: cx + dx * scale, y: cy + dy * scale };
  }
  const edgeEls = [];
  function drawEdges() {
    const key = e => e.source + '>' + e.target;
    const present = new Set(DATA.edges.map(key));
    DATA.edges.forEach(e => {
      const a = byId.get(e.source), b = byId.get(e.target);
      if (!a || !b) return;
      const ac = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, bc = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
      let shift = 0;
      if (present.has(e.target + '>' + e.source)) shift = e.source < e.target ? 7 : -7;
      const len = Math.hypot(bc.x - ac.x, bc.y - ac.y) || 1;
      const ox = -(bc.y - ac.y) / len * shift, oy = (bc.x - ac.x) / len * shift;
      const from = clip(a, { x: bc.x + ox, y: bc.y + oy }), to = clip(b, { x: ac.x + ox, y: ac.y + oy });
      const dashed = e.kind === 'IMPLEMENTS' || e.kind === 'USAGE';
      const hollow = e.kind === 'EXTENDS' || e.kind === 'IMPLEMENTS';
      const path = el('path', {
        class: 'edge' + (dashed ? ' dashed' : ''),
        d: `M${from.x + ox},${from.y + oy} L${to.x + ox},${to.y + oy}`,
        'marker-end': hollow ? 'url(#triangle)' : 'url(#arrow)',
      }, edgesLayer);
      const title = el('title', {}, path);
      title.textContent = { EXTENDS: 'herda de', IMPLEMENTS: 'implementa', ASSOCIATION: 'tem um atributo do tipo', USAGE: 'usa' }[e.kind];
      edgeEls.push({ e, path });
    });
  }

  /* ---- Pan e zoom ---- */
  let view = { x: 0, y: 0, k: 1 };
  function apply() { viewport.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }
  function zoomAt(factor, px, py) {
    const k = Math.min(3, Math.max(0.15, view.k * factor));
    view.x = px - (px - view.x) * (k / view.k);
    view.y = py - (py - view.y) * (k / view.k);
    view.k = k;
    apply();
  }
  function bounds() {
    const xs = DATA.nodes.flatMap(n => [n.x, n.x + n.w]), ys = DATA.nodes.flatMap(n => [n.y, n.y + n.h]);
    return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
  }
  function fit() {
    if (!DATA.nodes.length) return;
    const b = bounds(), w = svg.clientWidth, h = svg.clientHeight, margin = 60;
    const k = Math.min(1.2, (w - margin * 2) / (b.x1 - b.x0), (h - margin * 2) / (b.y1 - b.y0));
    view = { k, x: (w - (b.x1 - b.x0) * k) / 2 - b.x0 * k, y: (h - (b.y1 - b.y0) * k) / 2 - b.y0 * k };
    apply();
  }
  function centerOn(id) {
    const n = byId.get(id);
    if (!n) return;
    view.x = svg.clientWidth / 2 - (n.x + n.w / 2) * view.k;
    view.y = svg.clientHeight / 2 - (n.y + n.h / 2) * view.k;
    apply();
  }
  let drag = null;
  svg.addEventListener('mousedown', e => { drag = { x: e.clientX - view.x, y: e.clientY - view.y }; svg.classList.add('panning'); });
  window.addEventListener('mousemove', e => { if (drag) { view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; apply(); } });
  window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('panning'); });
  svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, { passive: false });
  document.getElementById('zoomIn').addEventListener('click', () => zoomAt(1.25, svg.clientWidth / 2, svg.clientHeight / 2));
  document.getElementById('zoomOut').addEventListener('click', () => zoomAt(0.8, svg.clientWidth / 2, svg.clientHeight / 2));
  document.getElementById('fit').addEventListener('click', fit);
  document.getElementById('centerFocus').addEventListener('click', () => centerOn(DATA.focus));
  window.addEventListener('resize', fit);

  /* ---- Seleção e busca ---- */
  let selectedId = null, matches = [], matchAt = -1;
  function select(id) {
    if (selectedId) boxEls.get(selectedId)?.classList.remove('selected');
    selectedId = id;
    boxEls.get(id)?.classList.add('selected');
    updateDim();
  }
  function updateDim() {
    const active = selectedId ? new Set([selectedId]) : null;
    if (active) DATA.edges.forEach(e => { if (e.source === selectedId) active.add(e.target); if (e.target === selectedId) active.add(e.source); });
    const searching = matches.length > 0;
    boxEls.forEach((g, id) => {
      g.classList.toggle('match', searching && matches.includes(id));
      g.classList.toggle('dim', searching ? !matches.includes(id) : false);
    });
    edgeEls.forEach(({ e, path }) => path.classList.toggle('dim', !!active && e.source !== selectedId && e.target !== selectedId));
  }
  const search = document.getElementById('search'), counter = document.getElementById('matches');
  search.addEventListener('input', () => {
    const text = search.value.trim().toLowerCase();
    matches = text ? DATA.nodes.filter(n => n.name.toLowerCase().includes(text)).map(n => n.id) : [];
    matchAt = -1;
    counter.textContent = text ? matches.length + ' achada' + (matches.length === 1 ? '' : 's') : '';
    updateDim();
  });
  search.addEventListener('keydown', e => {
    if (e.key === 'Enter' && matches.length) { matchAt = (matchAt + 1) % matches.length; centerOn(matches[matchAt]); }
    if (e.key === 'Escape') { search.value = ''; search.dispatchEvent(new Event('input')); search.blur(); }
  });
  window.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); } });

  window.ironDome = { select: id => { select(id); centerOn(id); } };

  /* ---- Início ---- */
  if (!DATA.nodes.length) {
    document.getElementById('empty').style.display = 'flex';
  } else {
    layout();
    draw();
    fit();
    document.getElementById('info').innerHTML =
      `<b>${DATA.nodes.length}</b> classes · <b>${DATA.edges.length}</b> ligações` +
      (DATA.truncated ? ' · limite de classes atingido' : '') +
      ' &nbsp;|&nbsp; clique seleciona · duplo clique abre · Ctrl+clique mira a classe';
  }
</script>
</body>
</html>
